name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.44.9'

jobs:
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [flutter-object-box, flutter-sq-lite]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - name: Install project dependencies
        run: flutter pub get
      - name: Build artifacts
        run: flutter build linux --release
      - name: Archive Release
        uses: thedoctor0/zip-release@master
        with:
          type: 'zip'
          filename: ${{ matrix.project }}-${{ github.ref_name }}-linux.zip
          directory: ${{ matrix.project }}/build/linux/x64/release/bundle
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project }}-linux
          path: ${{ matrix.project }}/build/linux/x64/release/bundle/${{ matrix.project }}-${{ github.ref_name }}-linux.zip

  build-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        project: [flutter-object-box, flutter-sq-lite]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
      - name: Install project dependencies
        run: flutter pub get
      - name: Build artifacts
        run: flutter build windows --release
      # Inclui o runtime do Visual C++ para rodar sem instalar o redistributable.
      - name: Bundle VC++ runtime
        run: |
          foreach ($dll in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            Copy-Item "$env:WINDIR\System32\$dll" build/windows/x64/runner/Release/
          }
      - name: Archive Release
        uses: thedoctor0/zip-release@master
        with:
          type: 'zip'
          filename: ${{ matrix.project }}-${{ github.ref_name }}-windows.zip
          directory: ${{ matrix.project }}/build/windows/x64/runner/Release
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project }}-windows
          path: ${{ matrix.project }}/build/windows/x64/runner/Release/${{ matrix.project }}-${{ github.ref_name }}-windows.zip

  release:
    needs: [build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
